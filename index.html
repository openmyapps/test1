<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Radio</title>
<style>
* {
    margin: 0;
    padding: 0;
    -webkit-box-sizing: border-box;
    box-sizing: border-box;
}
body {
    font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
    background: #f2f2f7;
    color: #1c1c1e;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    -webkit-overflow-scrolling: touch;
}
#list {
    list-style: none;
    padding: 20px 0 40px 0;
}
.station {
    position: relative;
    margin: 0 8px 1px 8px;
    padding: 13px 40px 13px 14px;
    background: #fff;
    font-size: 17px;
    line-height: 1.3;
    cursor: pointer;
}
.station:first-child {
    -webkit-border-radius: 10px 10px 0 0;
    border-radius: 10px 10px 0 0;
}
.station:last-child {
    -webkit-border-radius: 0 0 10px 10px;
    border-radius: 0 0 10px 10px;
    border-bottom: none;
}
.station:active {
    background: #e5e5ea;
}
.emoji {
    font-size: 22px;
    margin-right: 10px;
    vertical-align: middle;
}
.name {
    vertical-align: middle;
}
.dot {
    position: absolute;
    right: 16px;
    top: 50%;
    -webkit-transform: translateY(-50%);
    transform: translateY(-50%);
    width: 10px;
    height: 10px;
    display: none;
    -webkit-border-radius: 50%;
    border-radius: 50%;
}
.dot.green {
    display: block;
    background: #34c759;
}
.dot.red {
    display: block;
    background: #ff3b30;
}
</style>
</head>
<body>
<audio id="player" preload="none"></audio>
<ul id="list"></ul>
<script>
var player = document.getElementById("player");
var listEl = document.getElementById("list");
var current = -1;
var dots = [];

var stations = [
    { name: "\u0410\u0432\u0442\u043E\u0440\u0430\u0434\u0438\u043E", url: "https://hls-01-vtv.webcaramba.com/vtv-avtoradio-rp/playlist.m3u8", emoji: "\uD83D\uDE97" },
    { name: "\u0415\u0432\u0440\u043E\u043F\u0430 \u041F\u043B\u044E\u0441", url: "https://air.sammit.tv/europa/aac_hifi.m3u8", emoji: "\uD83C\uDF0D" },
    { name: "\u041A\u0443\u043B\u044C\u0442\u0443\u0440\u0430", url: "https://media2.datacenter.by/stream/kultura/stream", emoji: "\uD83C\uDFDB\uFE0F" },
    { name: "\u041D\u0430\u0440\u043E\u0434\u043D\u043E\u0435 \u0420\u0430\u0434\u0438\u043E", url: "https://live.novoeradio.by:444/live/narodnoeradio_aac128/icecast.audio", emoji: "\uD83D\uDCFB" },
    { name: "\u041D\u043E\u0432\u043E\u0435 \u0420\u0430\u0434\u0438\u043E", url: "https://live.novoeradio.by:444/live/novoeradio_aac128/icecast.audio", emoji: "\uD83C\uDFB5" },
    { name: "\u041F\u0435\u0440\u0432\u044B\u0439 \u043D\u0430\u0446\u0438\u043E\u043D\u0430\u043B\u044C\u043D\u044B\u0439", url: "https://media2.datacenter.by/stream/1kanal/stream", emoji: "\uD83C\uDF99\uFE0F" },
    { name: "\u041F\u0438\u043B\u043E\u0442 FM", url: "https://live.pilotfm.com/stream/pilotfm/aac128", emoji: "\u2708\uFE0F" },
    { name: "\u0420\u0430\u0434\u0438\u043E \u0412\u0438\u0442\u0435\u0431\u0441\u043A", url: "https://stream2.datacenter.by/vtvby", emoji: "\uD83C\uDFD9\uFE0F" },
    { name: "\u0420\u0430\u0434\u0438\u043E \u0420\u0435\u0442\u0440\u043E", url: "https://air.sammit.tv/retro/retro.m3u8", emoji: "\uD83D\uDCFC" },
    { name: "\u0420\u0430\u0434\u044B\u044F \u0421\u0442\u0430\u043B\u0456\u0446\u0430", url: "https://media2.datacenter.by/stream/stalica/stream", emoji: "\uD83C\uDFB8" },
    { name: "\u0420\u0430\u0434\u0438\u0443\u0441 FM", url: "https://radio.dc.beltelecom.by/radiusfm/radiusfm.stream/playlist.m3u8", emoji: "\uD83D\uDCE1" }
];

function buildList() {
    var html = "";
    for (var i = 0; i < stations.length; i++) {
        html += '<li class="station" data-i="' + i + '">'
            + '<span class="emoji">' + stations[i].emoji + '</span>'
            + '<span class="name">' + stations[i].name + '</span>'
            + '<span class="dot" id="dot' + i + '"></span>'
            + '</li>';
    }
    listEl.innerHTML = html;
    for (var j = 0; j < stations.length; j++) {
        dots[j] = document.getElementById("dot" + j);
    }
}

function clearDot(i) {
    if (dots[i]) {
        dots[i].className = "dot";
    }
}

function stopAll() {
    if (current >= 0) {
        clearDot(current);
    }
    player.pause();
    player.removeAttribute("src");
    player.load();
    current = -1;
}

function toggleStation(index) {
    if (current === index) {
        stopAll();
        return;
    }
    stopAll();
    current = index;
    player.src = stations[index].url;
    try { player.play(); } catch(e) {}
}

player.addEventListener("playing", function() {
    if (current >= 0) {
        dots[current].className = "dot green";
    }
}, false);

player.addEventListener("error", function() {
    if (current >= 0) {
        dots[current].className = "dot red";
    }
}, false);

player.addEventListener("pause", function() {
    if (current >= 0) {
        clearDot(current);
    }
}, false);

listEl.addEventListener("click", function(e) {
    var el = e.target;
    while (el && el.tagName !== "LI") {
        el = el.parentNode;
    }
    if (el && el.hasAttribute("data-i")) {
        toggleStation(parseInt(el.getAttribute("data-i"), 10));
    }
}, false);

buildList();
</script>
</body>
</html>
