<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0088cc">
<meta name="color-scheme" content="light dark">
<title>ТВ</title>
<style>
:root {
  --bg: #fff;
  --bg-active: #e3f2fd;
  --text: #222;
  --text-secondary: #888;
  --separator: #e5e5e5;
}
@media (prefers-color-scheme:dark) {
  :root {
    --bg: #17212b;
    --bg-active: #242f3d;
    --text: #e8e8e8;
    --text-secondary: #6c7883;
    --separator: #1f2b36;
  }
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-tap-highlight-color: transparent;
  overflow-y: auto;
}
.stations {
  list-style: none;
  padding: 8px 0;
}
.station {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 18px;
  cursor: pointer;
  transition: background .15s;
  user-select: none;
}
.station:active { background: var(--bg-active); }
.station + .station { border-top: 1px solid var(--separator); }
.station-icon { font-size: 26px; line-height: 1; flex-shrink: 0; }
.station-name {
  font-size: 17px;
  font-weight: 500;
  flex: 1;
  line-height: 1.3;
}
.station-indicator {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--text-secondary);
  flex-shrink: 0;
  transition: background .2s, box-shadow .2s;
}
.station.active,
.station.connecting { background: var(--bg-active); }
.station.active .station-indicator {
  background: #4caf50;
  box-shadow: 0 0 6px #4caf50;
  animation: pulse 1.4s ease-in-out infinite;
}
.station.connecting .station-indicator {
  background: #ff9800;
  box-shadow: 0 0 6px #ff9800;
  animation: pulse 1.4s ease-in-out infinite;
}
.station.error .station-indicator { background: #e53935; animation: none; box-shadow: none; }
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: .5; transform: scale(.75); }
}
.video-wrapper {
  background: #000;
  width: 100%;
  aspect-ratio: 16 / 9;
  max-height: 50vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: sticky;
  top: 0;
  z-index: 10;
  box-shadow: 0 2px 8px rgba(0,0,0,.15);
}
.video-wrapper video {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: contain;
}
.video-controls {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 12px;
  background: linear-gradient(transparent, rgba(0,0,0,.7));
  opacity: 0;
  transition: opacity .25s;
  z-index: 2;
}
.video-wrapper:hover .video-controls,
.video-wrapper.show-controls .video-controls {
  opacity: 1;
}
.ctrl-btn {
  background: none;
  border: none;
  color: #fff;
  font-size: 22px;
  padding: 6px 10px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 6px;
}
.ctrl-btn:active { background: rgba(255,255,255,.15); }
.ctrl-station-name {
  color: rgba(255,255,255,.85);
  font-size: 14px;
  flex: 1;
  text-align: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  padding: 0 8px;
}
.video-wrapper.css-fullscreen {
  position: fixed !important;
  top: 0 !important;
  left: 0 !important;
  width: 100vw !important;
  height: 100vh !important;
  max-height: none !important;
  aspect-ratio: unset !important;
  z-index: 999999 !important;
  box-shadow: none !important;
}
.video-wrapper.css-fullscreen video {
  width: 100%;
  height: 100%;
  object-fit: contain;
}
.css-fs-close {
  position: fixed;
  top: 10px;
  right: 10px;
  z-index: 1000000;
  background: rgba(0,0,0,.6);
  color: #fff;
  border: none;
  font-size: 24px;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: none;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}
.video-wrapper.css-fullscreen ~ .css-fs-close { display: flex; }
.open-browser-bar {
  display: none;
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 12px 16px;
  padding-bottom: max(12px, env(safe-area-inset-bottom));
  background: var(--bg);
  border-top: 1px solid var(--separator);
  z-index: 100;
  text-align: center;
}
.open-browser-bar a {
  display: inline-block;
  padding: 12px 28px;
  background: #0088cc;
  color: #fff;
  text-decoration: none;
  border-radius: 10px;
  font-size: 16px;
  font-weight: 600;
}
@media (prefers-color-scheme:dark) {
  .open-browser-bar { background: #17212b; border-color: #1f2b36; }
}
</style>
</head>
<body>
<div class="video-wrapper" id="videoWrapper">
  <video id="tv" autoplay playsinline></video>
  <div class="video-controls">
    <button class="ctrl-btn" id="btnPlay" aria-label="Play/Pause">&#9654;</button>
    <span class="ctrl-station-name" id="ctrlName"></span>
    <button class="ctrl-btn" id="btnFS" aria-label="Fullscreen">&#x26F6;</button>
  </div>
</div>
<button class="css-fs-close" id="cssFsClose">&times;</button>
<ul class="stations" id="stations"></ul>
<div class="open-browser-bar" id="openBar"><a id="openLink" href="#" target="_blank">Открыть в браузере</a></div>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
const STATIONS = [
  { name: 'АВТО24', icon: '🚘', url: 'https://stream8.cinerama.uz/1430/tracks-v1a1/mono.m3u8' },
  { name: 'Беларусь 1', icon: '📺', url: 'https://ngtrk.dc.beltelecom.by/ngtrk/smil:belarus1/playlist.m3u8' },
  { name: 'Беларусь 2', icon: '🍿', url: 'https://ngtrk.dc.beltelecom.by/ngtrk/smil:belarus2/playlist.m3u8' },
  { name: 'Беларусь 3', icon: '🏛️', url: 'https://ngtrk.dc.beltelecom.by/ngtrk/smil:belarus3/playlist.m3u8' },
  { name: 'Беларусь 4', icon: '🏞️', url: 'https://live.dc.beltelecom.by/vtv/bt4.stream/playlist.m3u8' },
  { name: 'Беларусь 5', icon: '🏆', url: 'https://ngtrk.dc.beltelecom.by/ngtrk/smil:belarus5/playlist.m3u8' },
  { name: 'Беларусь 24', icon: '📡', url: 'https://ngtrk.dc.beltelecom.by/ngtrk/smil:belarus24/playlist.m3u8' },
  { name: 'Доктор', icon: '🏥', url: 'https://stream8.cinerama.uz/1409/tracks-v1a1/mono.m3u8' },
  { name: 'Живая Планета', icon: '🌿', url: 'https://stream8.cinerama.uz/1250/tracks-v1a1/mono.m3u8' },
  { name: 'История', icon: '📜', url: 'https://stream8.cinerama.uz/1266/tracks-v1a1/mono.m3u8' },
  { name: 'Карусель', icon: '🎠', url: 'https://zabava-htlive.cdn.ngenix.net/hls/CH_KARUSEL/variant.m3u8' },
  { name: 'Моя Планета', icon: '🌍', url: 'https://stream8.cinerama.uz/1247/tracks-v1a1/mono.m3u8' },
  { name: 'Муз-ТВ', icon: '🎵', url: 'https://zabava-htlive.cdn.ngenix.net/hls/CH_MUZTV/variant.m3u8' },
  { name: 'Наука', icon: '🔬', url: 'https://stream8.cinerama.uz/1248/tracks-v1a1/mono.m3u8' },
  { name: 'Охота и рыбалка', icon: '🎣', url: 'https://stream8.cinerama.uz/1038/tracks-v1a1/mono.m3u8' },
  { name: 'Первый информационный', icon: '📰', url: 'https://ngtrk.dc.beltelecom.by/ngtrk/smil:informacionnyy/playlist.m3u8' },
  { name: 'СТВ', icon: '🏙️', url: 'https://ngtrk.dc.beltelecom.by/ctv/ctv.stream/playlist.m3u8' },
  { name: 'СТС', icon: '😂', url: 'https://zabava-htlive.cdn.ngenix.net/hls/CH_STS/variant.m3u8' },
  { name: 'СТС Love', icon: '🩷', url: 'https://zabava-htlive.cdn.ngenix.net/hls/CH_STSLOVE/variant.m3u8' },
  { name: 'Т24', icon: '⚙️', url: 'https://stream8.cinerama.uz/1037/tracks-v1a1/mono.m3u8' },
  { name: '2x2', icon: '🤘', url: 'https://zabava-htlive.cdn.ngenix.net/hls/CH_2X2/variant.m3u8' }
];

const tv = document.getElementById('tv');
const wrapper = document.getElementById('videoWrapper');
const list = document.getElementById('stations');
const btnPlay = document.getElementById('btnPlay');
const btnFS = document.getElementById('btnFS');
const ctrlName = document.getElementById('ctrlName');
const cssFsClose = document.getElementById('cssFsClose');
const openBar = document.getElementById('openBar');
const openLink = document.getElementById('openLink');
let hls = null, activeIndex = -1, nodes = [], playAttempt = 0;
let cssFullscreen = false;
let controlsTimer = null;

const isTelegram = !!(window.Telegram && Telegram.WebApp && Telegram.WebApp.initData);

if (isTelegram) {
  openLink.href = location.href;
  openBar.style.display = 'block';
}

function render() {
  list.innerHTML = STATIONS.map((s, i) =>
    `<li class="station" data-index="${i}">
      <span class="station-icon">${s.icon}</span>
      <span class="station-name">${s.name}</span>
      <span class="station-indicator"></span>
    </li>`
  ).join('');
  nodes = [...list.children];
}

function setActive(idx) {
  nodes.forEach((el, i) => {
    el.classList.toggle('active', i === idx && idx >= 0);
    el.classList.remove('error', 'connecting');
  });
  activeIndex = idx;
  ctrlName.textContent = idx >= 0 ? STATIONS[idx].name : '';
}

function updatePlayBtn() {
  btnPlay.innerHTML = tv.paused ? '&#9654;' : '&#9646;&#9646;';
}

function stop() {
  if (hls) { hls.destroy(); hls = null; }
  tv.onerror = null;
  tv.onended = null;
  tv.pause();
  tv.removeAttribute('src');
  tv.load();
  setActive(-1);
  ctrlName.textContent = '';
  updatePlayBtn();
}

function play(idx) {
  const id = ++playAttempt;
  const station = STATIONS[idx];
  const el = nodes[idx];
  el.classList.add('connecting');

  if (typeof Hls === 'undefined' || !Hls.isSupported()) {
    el.classList.replace('connecting', 'error');
    return;
  }
  if (hls) hls.destroy();
  tv.onerror = null;
  hls = new Hls();
  hls.loadSource(station.url);
  hls.attachMedia(tv);
  hls.on(Hls.Events.MANIFEST_PARSED, () => {
    if (id !== playAttempt) return;
    el.classList.remove('connecting');
    setActive(idx);
    tv.play().then(updatePlayBtn).catch(() => {
      if (id !== playAttempt) return;
      el.classList.replace('active', 'error'); setActive(-1);
    });
  });
  hls.on(Hls.Events.ERROR, (_, data) => {
    if (data.fatal && id === playAttempt) { el.classList.remove('active', 'connecting'); el.classList.add('error'); setActive(-1); }
  });
}

function toggle(idx) {
  if (idx === activeIndex) { stop(); return; }
  stop();
  play(idx);
}

function requestFS(el) {
  if (el.requestFullscreen) return el.requestFullscreen();
  if (el.webkitRequestFullscreen) return el.webkitRequestFullscreen();
  if (el.mozRequestFullScreen) return el.mozRequestFullScreen();
  if (el.msRequestFullscreen) return el.msRequestFullscreen();
  return Promise.reject('no fullscreen api');
}

function exitFS() {
  if (document.exitFullscreen) return document.exitFullscreen();
  if (document.webkitExitFullscreen) return document.webkitExitFullscreen();
  if (document.mozCancelFullScreen) return document.mozCancelFullScreen();
  if (document.msExitFullscreen) return document.msExitFullscreen();
}

function toggleFullscreen() {
  const isFS = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;
  if (isFS) {
    exitFS();
  } else {
    requestFS(wrapper).catch(() => {
      cssToggle();
    });
  }
}

function cssToggle() {
  if (cssFullscreen) {
    cssExit();
  } else {
    cssEnter();
  }
}

function cssEnter() {
  cssFullscreen = true;
  wrapper.classList.add('css-fullscreen');
  cssFsClose.style.display = 'flex';
  if (screen.orientation && screen.orientation.lock) {
    screen.orientation.lock('landscape').catch(() => {});
  }
}

function cssExit() {
  cssFullscreen = false;
  wrapper.classList.remove('css-fullscreen');
  cssFsClose.style.display = 'none';
  if (screen.orientation && screen.orientation.unlock) {
    screen.orientation.unlock();
  }
}

btnPlay.addEventListener('click', () => {
  if (activeIndex < 0) return;
  if (tv.paused) { tv.play().then(updatePlayBtn); } else { tv.pause(); updatePlayBtn(); }
});

btnFS.addEventListener('click', toggleFullscreen);

cssFsClose.addEventListener('click', cssExit);

tv.addEventListener('click', (e) => {
  e.preventDefault();
  if (activeIndex < 0) return;
  if (tv.paused) { tv.play().then(updatePlayBtn); } else { tv.pause(); updatePlayBtn(); }
});

wrapper.addEventListener('click', (e) => {
  if (e.target.closest('.ctrl-btn') || e.target === tv) return;
  showControlsBriefly();
});

function showControlsBriefly() {
  wrapper.classList.add('show-controls');
  clearTimeout(controlsTimer);
  controlsTimer = setTimeout(() => wrapper.classList.remove('show-controls'), 2500);
}

document.addEventListener('fullscreenchange', updateFSBtn);
document.addEventListener('webkitfullscreenchange', updateFSBtn);

function updateFSBtn() {
  const isFS = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;
  btnFS.innerHTML = isFS ? '&#x26F6;' : '&#x26F6;';
  btnFS.title = isFS ? 'Выйти из полноэкранного' : 'Полноэкранный';
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (cssFullscreen) cssExit();
    else stop();
  }
  if (e.key === ' ' && activeIndex >= 0) { e.preventDefault(); tv.paused ? tv.play().then(updatePlayBtn) : (tv.pause(), updatePlayBtn()); }
  if (e.key === 'f' || e.key === 'F') toggleFullscreen();
});

list.addEventListener('click', e => {
  const item = e.target.closest('.station');
  if (!item) return;
  toggle(+item.dataset.index);
});

tv.addEventListener('play', updatePlayBtn);
tv.addEventListener('pause', updatePlayBtn);

render();

showControlsBriefly();
</script>
</body>
</html>
